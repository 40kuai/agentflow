id: simple_dev
start: pm_analyze
# simple_dev 是**串行等价性基线**：三节点直线、全部 isolate=false，行为不得改变。
# worktree 隔离与确定性合并能力已由 Task 11 提供（isolate: true 的节点会在独立 worktree 中运行，
# 批次结束后按 owns 归属确定性合并回主工作区，见 src/kernel/scheduler.ts 与 src/kernel/merge.ts）；
# 本文件刻意保持非隔离，并行示例工作流属 Task 12。
#
# 契约唯一来源：本文件节点的 consumes/produces 是**派生**字段，权威来源是 config/roles/*.yaml
# 的 inputs/outputs。二者不一致时加载期报错（详见 src/config/loader.ts）。
nodes:
  - id: pm_analyze
    title: 需求分析
    role: pm
    description: 把原始需求转写成可验收的需求文档，是整条流程的起点。
    entry_condition: 任务开始即进入（起始节点）。
    consumes: []
    produces: requirement
    isolate: false

  - id: dev_implement
    title: 编码实现
    role: backend_dev
    description: 依据需求文档在 src/** 内完成实现并自测，产出可被测试的代码改动。
    entry_condition: 上游 pm_analyze 产出 requirement 且其 status 为 ok。
    consumes:
      - requirement
    produces: code_diff
    isolate: false

  - id: qa_verify
    title: 测试验证
    role: qa_engineer
    description: 针对需求验收标准与代码改动编写并运行测试，如实汇总结果；缺陷通过产物报告，不改实现。
    entry_condition: 上游 dev_implement 产出 code_diff 且其 status 为 ok。
    consumes:
      - requirement
      - code_diff
    produces: test_report
    isolate: false

edges:
  - from: pm_analyze
    to: dev_implement
    when: "all(artifacts.requirement.status == 'ok')"
    description: 需求已澄清（status=ok）时才进入编码实现；否则不应带着歧义开工。
    on_missing: fail

  - from: dev_implement
    to: qa_verify
    when: "all(artifacts.code_diff.status == 'ok')"
    description: 代码改动自测通过（code_diff.status=ok）时才进入测试验证。
    on_missing: fail